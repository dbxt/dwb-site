<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG card</title>
<style>
  @font-face { font-family: "Fraunces"; font-weight: 400 500; src: url("../../assets/fonts/fraunces-latin.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400 600; src: url("../../assets/fonts/plex-sans-latin.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../../assets/fonts/plex-mono-latin.woff2") format("woff2"); }
  :root { --paper: #ffffff; --ink: #15202b; --muted: #4a5867; --rule: #d3dbe4; --accent: #a83f1f; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", Arial, sans-serif; position: relative; }
  body::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 14px; background: var(--accent); }
  .card { height: 100%; padding: 56px 64px 48px 78px; display: grid; grid-template-rows: 1fr auto; }
  .body { display: grid; grid-template-columns: 1fr; gap: 48px; align-items: center; min-height: 0; }
  .body.has-image { grid-template-columns: 1fr 470px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 68px; line-height: 1.06; letter-spacing: -0.01em; }
  .sub { margin-top: 26px; font-size: 30px; line-height: 1.35; color: var(--muted); max-width: 640px; }
  .no-image h1 { font-size: 84px; }
  .no-image .sub { font-size: 34px; max-width: 900px; }
  .shot { height: 420px; border: 1px solid var(--rule); border-radius: 12px; background-size: cover; background-position: top left; box-shadow: 0 18px 40px rgba(21,32,43,.16); }
  .shot.portrait { height: 400px; background-position: center 12%; }
  footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 22px; }
  .who { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 500; }
  .who img { width: 54px; height: 54px; }
  .url { font-family: "IBM Plex Mono", monospace; font-size: 22px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="body" id="body">
    <div>
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="shot" id="shot" hidden></div>
  </div>
  <footer>
    <div class="who"><img src="../../assets/dwb-favicon-192.png" alt="" /><span>David Wayne Baxter</span></div>
    <span class="url">davidwaynebaxter.com</span>
  </footer>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('kicker').textContent = q.get('kicker') || '';
  document.getElementById('title').textContent = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
  const img = q.get('image'), body = document.getElementById('body'), shot = document.getElementById('shot');
  if (img) {
    shot.hidden = false; body.classList.add('has-image');
    shot.style.backgroundImage = 'url("../../assets/' + img + '")';
    if (q.get('portrait')) shot.classList.add('portrait');
  } else body.classList.add('no-image');
</script>
</body>
</html>
