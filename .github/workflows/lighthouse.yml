name: Lighthouse
# Audits the live site (mobile profile, median of 3 runs per page) against the budgets in tools/lighthouserc.json:
# Lighthouse scores, LCP <= 2.5 s, CLS <= 0.1, TBT <= 200 ms. A failure means a change made the site slower.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: '17 9 * * 1'   # weekly, Mondays 09:17 UTC, to catch drift the deploy did not cause
  workflow_dispatch:
jobs:
  lighthouse:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./tools/lighthouserc.json
          uploadArtifacts: true
