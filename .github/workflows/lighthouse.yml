name: Lighthouse
# Audits the live site (mobile profile, median of 3 runs per page) against the budgets in tools/lighthouserc.json:
# Lighthouse scores, LCP <= 2.5 s, CLS <= 0.1, TBT <= 300 ms. A failure means a change made the site slower.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: '17 9 * * 1'   # weekly, Mondays 09:17 UTC, to catch drift the deploy did not cause
  workflow_dispatch:
jobs:
  lighthouse:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./tools/lighthouserc.json
          uploadArtifacts: true
