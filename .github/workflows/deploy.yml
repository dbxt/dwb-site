name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the sitemap script can read each page's last-modified date
      - name: Refresh sitemap lastmod dates
        run: python3 tools/sitemap-lastmod.py
      # Only files this action uploaded earlier are ever deleted (tracked in .ftp-deploy-sync-state.json),
      # so other folders on the server, such as subdomain document roots, are left alone.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tools/**
      # A courtesy ping so Bing and other IndexNow engines re-crawl changed pages promptly; never fails the deploy.
      - name: Notify IndexNow of changed pages
        continue-on-error: true
        run: python3 tools/indexnow.py --before "${{ github.event.before }}" --after "${{ github.sha }}"
