name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwb-site-cloudflare-pages-production
  cancel-in-progress: true

env:
  # The workflow uploads static assets only. It never creates, changes, or
  # binds DNS/custom domains; it may create this Pages project on first deploy.
  CLOUDFLARE_PAGES_PROJECT: davidwaynebaxter-com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh generated public content
        run: |
          python3 tools/sitemap-lastmod.py
          python3 tools/latest.py

      - name: Assemble the public Pages artifact
        env:
          OUTPUT_DIR: ${{ runner.temp }}/dwb-site
        run: |
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/' \
            --exclude 'tools/' \
            --exclude 'node_modules/' \
            --exclude '.htaccess' \
            ./ "$OUTPUT_DIR/"
          test -f "$OUTPUT_DIR/index.html"
          test -f "$OUTPUT_DIR/404.html"
          test -f "$OUTPUT_DIR/robots.txt"
          test -f "$OUTPUT_DIR/sitemap.xml"
          test ! -e "$OUTPUT_DIR/.htaccess"
          if grep -R --exclude='*.map' -nE '__[A-Z][A-Z0-9_]*__' "$OUTPUT_DIR"; then
            echo 'Unresolved deployment placeholders found in Pages artifact.' >&2
            exit 1
          fi

      - name: Ensure the Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ env.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          account_id = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          project_name = os.environ['PROJECT_NAME']
          project_url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project_name}'
          create_url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects'
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          try:
              with urlopen(Request(project_url, headers=headers), timeout=30) as response:
                  response.read()
              print(f'Cloudflare Pages project {project_name!r} already exists.')
          except HTTPError as error:
              if error.code != 404:
                  raise
              payload = json.dumps({
                  'name': project_name,
                  'production_branch': 'main',
              }).encode()
              with urlopen(Request(create_url, data=payload, headers=headers, method='POST'), timeout=30) as response:
                  response.read()
              print(f'Created Cloudflare Pages project {project_name!r}.')
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy "${{ runner.temp }}/dwb-site"
            --project-name="${{ env.CLOUDFLARE_PAGES_PROJECT }}"
            --branch=main
